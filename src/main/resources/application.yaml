server:
  address: 0.0.0.0
  # HTTPS обслуживает nginx (контейнер http-redirect, конфиг deploy/nginx/bikeboxgo.conf),
  # gateway работает по HTTP внутри сети suitcase-network и наружу не открыт
  port: 8080
  # Схема, хост и IP посетителя берутся из заголовков X-Forwarded-* от nginx
  forward-headers-strategy: native

spring:
  main:
    web-application-type: reactive
  application:
    name: suitcase-gateway
  boot:
    admin:
      client:
        url: https://103.74.93.74:8085  # Адрес сервера SBA
        instance:
          name: suitcase-gateway

  cloud:
    gateway:
      routes:
        # Точный путь /booking (список GET) не попадает под шаблон /booking/** в некоторых версиях Gateway
        - id: suitcase-booking
          uri: http://suitcase-booking-container:8081  # Внутренний адрес контейнера
          predicates:
            - Path=/booking,/booking/**

        - id: suitcase-booking
          uri: http://suitcase-booking-container:8081  # Внутренний адрес контейнера
          predicates:
            - Path=/availability/**

        - id: suitcase-booking
          uri: http://suitcase-booking-container:8081  # Внутренний адрес контейнера
          predicates:
            - Path=/dashboard/**

        # Подписка админки на push-уведомления (доступ только после входа — SecurityConfig)
        - id: suitcase-booking
          uri: http://suitcase-booking-container:8081  # Внутренний адрес контейнера
          predicates:
            - Path=/push/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env, loggers
  endpoint:
    health:
      show-details: always
