name: Build and Deploy Gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # Шаг 1: Копируем JAR файл на удаленный сервер
      - name: Copy JAR to remote server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "build/libs/suitcase-gateway-0.0.1-SNAPSHOT.jar"
          target: "/root/suitcase-app/gateway"

      # Шаг 2: Копируем Dockerfile на удаленный сервер
      - name: Copy Dockerfile to remote server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "Dockerfile"
          target: "/root/suitcase-app/gateway"

      # Конфиг nginx, который принимает 80/443 и расшифровывает HTTPS перед gateway
      - name: Copy nginx config to remote server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "deploy/nginx/bikeboxgo.conf"
          target: "/root/suitcase-app/gateway"
          strip_components: 2

      # Шаг 3: Создаем Docker-сеть
      - name: Create Docker Network
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # Создаем Docker-сеть (если она еще не существует)
            docker network create suitcase-network || true

      # Шаг 4: Выполняем SSH-команды для сборки и запуска контейнера
      - name: SSH Command to Build and Run Docker Container
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /root/suitcase-app/gateway

            # Остановить и удалить старый контейнер, если он существует
            docker stop suitcase-gateway-container || true
            docker rm suitcase-gateway-container || true

            # Построить новый образ
            docker build -t suitcase-gateway .

            # Запустить новый контейнер и подключить его к сети (наружу его открывает nginx)
            docker run -d --restart unless-stopped --name suitcase-gateway-container --network suitcase-network suitcase-gateway

            # nginx на 80/443 перед gateway. Имя http-redirect оставлено прежним:
            # его останавливает и запускает /usr/local/bin/update-ssl-cert.sh при продлении сертификата
            docker rm -f http-redirect || true
            docker run -d --restart unless-stopped --name http-redirect --network suitcase-network \
              -p 80:80 -p 443:443 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -v /root/suitcase-app/gateway/bikeboxgo.conf:/etc/nginx/conf.d/default.conf:ro \
              nginx:1.27-alpine
