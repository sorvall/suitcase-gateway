# nginx перед gateway: принимает HTTP/HTTPS снаружи, TLS расшифровывает сам
# и передаёт запросы в suitcase-gateway-container по HTTP внутри сети suitcase-network.
# Сертификат берётся прямо из /etc/letsencrypt (certbot), keystore.p12 не нужен.

# Встроенный DNS Docker: адрес gateway ищется при каждом запросе,
# поэтому после передеплоя gateway (новый внутренний IP) nginx не надо перезапускать
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name bikeboxgo.ru www.bikeboxgo.ru;

    return 301 https://bikeboxgo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bikeboxgo.ru www.bikeboxgo.ru;

    ssl_certificate     /etc/letsencrypt/live/bikeboxgo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikeboxgo.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        set $gateway http://suitcase-gateway-container:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
